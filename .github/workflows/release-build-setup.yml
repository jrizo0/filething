# Steps que `dist` inyecta en cada job de build del release (ver
# dist-workspace.toml `github-build-setup`). Hornea la URL del Coordinator
# gestionado como default de compile-time del binario: `option_env!` en
# apps/cli/src/env.rs — las env vars CONVEX_URL/CONVEX_SELF_HOSTED_URL siguen
# teniendo precedencia en runtime (self-hosting intacto).
- name: Bake managed Coordinator URL into the release binary
  shell: bash
  run: echo "FILETHING_DEFAULT_CONVEX_URL=https://knowing-giraffe-699.convex.cloud" >> "$GITHUB_ENV"

# `dist build` shells out to `cargo build` and offers no way to pass `--locked`,
# so a tagged release could otherwise resolve dependency versions that differ
# from the ones CI tested (CI itself does use `--locked`). `cargo fetch --locked`
# fails when Cargo.lock is not already consistent with Cargo.toml, which turns
# that silent drift into a failed release — and it warms the dependency cache the
# build is about to use anyway.
- name: Verify Cargo.lock is current (release must build what CI tested)
  shell: bash
  run: cargo fetch --locked
